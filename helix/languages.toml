# ====== R ======
[[language]]
name = "r"
file-types = ["R", "Rmd"]
auto-format = true
language-servers = ["air", "r"]

# --- Python ---
[[language]]
name = "python"
file-types = ["py", "ipynb"]
language-servers = ["ty", "ruff"]
formatter = { command = "ruff", args = ["format", "-"] }
auto-format = true

# ====== C ======
[[language]]
name = "c"
file-types = ["c", "h"]
auto-format = true

[language.formatter]
command = "clang-format"
args = []

# ====== LaTeX ======
[[language]]
name = "latex"
file-types = ["tex", "sty", "cls", "ltx"]
language-servers = ["texlab"]
formatter = { command = "latexindent", args = ["-l"], stdin = true }
auto-format = true

# ====== TOML ======
[[language]]
name = "toml"
auto-format = true
language-servers = ["tombi"]

[language-server.air]
command = "air"
args = ["language-server"]

[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.ty]
command = "ty"
args = ["server"]
